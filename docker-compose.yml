version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: investor_crm_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: investor_crm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: investor_crm_app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/investor_crm"
      AUTH_SECRET: "change-this-to-a-random-secret-key-in-production"
      NEXTAUTH_URL: "http://localhost:3000"
      APP_ADMIN_EMAIL: "admin@example.com"
      APP_ADMIN_PASSWORD: "changeme"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm run dev"

volumes:
  postgres_data:
